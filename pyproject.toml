[project]
name = "workspace-docs"
version = "0.1.0"
description = "Documentation notebooks and examples for workspace user and operator journeys."
readme = "README.md"
requires-python = "==3.13.5"
dependencies = [
  "jupyterlab>=4.0",
  "ipykernel>=6.0",
  "pyjwt>=2.10.1",
  "python-dotenv>=1.2.1",
  "boto3",
  "rasterio",
  "shapely",
  "stac-geoparquet",
  "pillow",
  "pyarrow",
  "stacpkg==0.2.0",
  "pystac-client>=0.9,<1",
  "requests>=2.32,<3",
  "pystac>=1.14,<2",
  "oras==0.2.42",
  "portolan-cli==0.8.0",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.0",
  "ruff>=0.5",
]
