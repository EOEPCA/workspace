###########
# Storage #
###########
apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: ws-alice
  namespace: workspace
  labels:
    storages.pkg.internal/environment: datalab
spec:
  principal: ws-alice
  credentialsRollover:
    interval: weekly
    maxToKeep: 2
  buckets:
    - bucketName: ws-alice
      discoverable: true
    - bucketName: ws-alice-2
      discoverable: true
    - bucketName: ws-alice-3
      discoverable: true
  bucketAccessGrants:
    - bucketName: ws-alice-3
      grantee: ws-eric
      permission: ReadWrite
      grantedAt: "2025-10-14T08:09:10.817000+00:00"
  bucketAccessRequests:
    - bucketName: ws-eric-shared
      reason: requesting access
      requestedAt: "2025-10-19T13:25:59.655000+00:00"

---
apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: ws-bob
  namespace: workspace
  labels:
    storages.pkg.internal/environment: datalab
spec:
  principal: ws-bob
  buckets:
    - bucketName: ws-bob
      discoverable: true
      lifecycleRules:
        - target: tmp/*
          mode: Delete
          minAge: 12h
        - target: scratch/*
          mode: Notify
          minAge: 1w
---
apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: ws-eric
  namespace: workspace
  labels:
    storages.pkg.internal/environment: datalab
spec:
  principal: ws-eric
  buckets:
    - bucketName: ws-eric
      discoverable: true
    - bucketName: ws-eric-shared
      discoverable: true
  bucketAccessGrants:
    - bucketName: ws-eric-shared
      grantee: ws-alice
      permission: ReadWrite
      grantedAt: "2025-10-19T13:28:45.636000+00:00"
  bucketAccessRequests:
    - bucketName: ws-alice-3
      reason: requesting access
      requestedAt: "2025-10-14T08:08:53.953000+00:00"
---
###########
# Datalab #
###########
apiVersion: pkg.internal/v1beta2
kind: Datalab
metadata:
  name: ws-alice
  namespace: workspace
  annotations:
    datalabs.pkg.internal/environment: datalab
spec:
  users:
    - alice
  sessions:
    - name: default
      state: stopped
  databases:
    pg0:
      type: postgres
      names:
        - catalog
      storage: 1Gi
  vclusters:
    vc0:
      secretBindings:
        - type: postgres
          name: pg0
          target:
            namespace: stac-fastapi-pgstac
            name: managed-postgres
      groups:
        - name: demo
          namespace: stac-fastapi-pgstac
          role: edit
---
apiVersion: pkg.internal/v1beta2
kind: Datalab
metadata:
  name: ws-bob
  namespace: workspace
  annotations:
    datalabs.pkg.internal/environment: datalab
spec:
  users:
    - bob
    - alice
  userOverrides:
    alice:
      grantedAt: "2025-10-15T08:08:53.953000+00:00"
      role: user
  sessions:
    - name: default
      state: stopped
  documentStores:
    prod:
      type: mongo
      storage: 1Gi
  cacheStores:
    prod:
      type: redis
      storage: 1Gi
  databases:
    pg0:
      type: postgres
      names:
      - dev
      - prod
      storage: 1Gi
      backupStorage: 10Gi
---
apiVersion: pkg.internal/v1beta2
kind: Datalab
metadata:
  name: ws-eric
  namespace: workspace
  annotations:
    datalabs.pkg.internal/environment: datalab
spec:
  users:
    - eric
  sessions:
    - name: default
      state: stopped
