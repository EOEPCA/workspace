apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-migrate
  namespace: stac-fastapi-pgstac
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: python:3.13.5-slim
          command: [/bin/sh, -ec]
          args:
            - |
              python -m pip install --disable-pip-version-check --no-cache-dir --target /tmp/python 'pypgstac[psycopg]==0.10.0' 'psycopg[binary,pool]==3.3.7'
              python /scripts/migrate.py
          env:
            - {name: PYTHONPATH, value: /tmp/python}
            - name: PGHOST
              valueFrom:
                secretKeyRef: {name: managed-postgres, key: host}
            - name: PGPORT
              valueFrom:
                secretKeyRef: {name: managed-postgres, key: port}
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: managed-postgres, key: user}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: managed-postgres, key: password}
            - name: PGDATABASE
              value: catalog
            - name: PGSSLMODE
              value: require
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: CATALOG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-postgres
                  key: PGPASSWORD
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: scripts
          configMap:
            name: catalog-migrate
