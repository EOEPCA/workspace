apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cng-stac-registry
  labels:
    app: cng-stac-registry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cng-stac-registry
  labels:
    app: cng-stac-registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cng-stac-registry
  template:
    metadata:
      labels:
        app: cng-stac-registry
    spec:
      automountServiceAccountToken: false
      containers:
        - name: registry
          image: registry:3.1.2@sha256:38907510915c3f1604c7e83d6ab602ab3020d092f73bdaed8696773693ff768c
          env:
            - name: REGISTRY_HTTP_ADDR
              value: ":5000"
            - name: REGISTRY_HTTP_RELATIVEURLS
              value: "true"
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            - name: REGISTRY_LOG_LEVEL
              value: info
            - name: OTEL_TRACES_EXPORTER
              value: none
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cng-stac-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: cng-stac-registry
  labels:
    app: cng-stac-registry
spec:
  selector:
    app: cng-stac-registry
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cng-stac-registry-client
  labels:
    app: cng-stac-registry
data:
  registry.py: {{REGISTRY_CLIENT_SCRIPT}}
