site_name: EOEPCA Workspace Building Block
site_url: https://eoepca.readthedocs.io/projects/workspace/
repo_url: https://github.com/EOEPCA/workspace/
edit_uri: "edit/main/docs/"

nav:
  - EOEPCA Documentation: https://eoepca.readthedocs.io/
  - Workspace:
    - Overview: index.md
    - Concepts: concepts.md
    - Getting Started:
      - Quickstart: getting-started/quickstart.md
      - Notebook guide: usage/notebook-guide.md
      - Workspace Management: workspace-management.ipynb
      - Vienna imagery with STAC and S3: getting-started/vienna-imagery-with-stac-and-s3.ipynb
      - Register STAC metadata: getting-started/register-stac-metadata.ipynb
    - For Operators:
      - Installation: getting-started/installation.md
      - design/architecture.md
      - design/iam-integration.md
      - design/operational-controls.md
    - API References:
      - Storage CRD ↗: https://provider-storage.versioneer.at/latest/reference-guides/api/
      - Datalab CRD ↗: https://provider-datalab.versioneer.at/latest/reference-guides/api/

theme:
  name: material
  logo: img/favicon.ico
  favicon: img/favicon.ico
  features:
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.share
    - search.suggest

extra_css:
  - css/eoepca.css

hooks:
  - docs/notebook_links.py

plugins:
  - search
  - autorefs
  - mkdocs-jupyter:
      execute: false
      ignore_h1_titles: true
      ignore:
        - notebook_support.py
        - notebook_links.py

markdown_extensions:
  - tables
  - toc:
      permalink: ⚓︎
      toc_depth: 4
  - smarty
  - sane_lists
  - admonition
  - abbr
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
