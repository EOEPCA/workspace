{{- $data := omit .Values.environmentconfig "name" "annotations" -}}
{{- $ingress := $data.ingress | default dict -}}
{{- $httpRoute := $data.httpRoute | default dict -}}
{{- if and $ingress.enabled $httpRoute.enabled -}}
  {{- fail "Enable only one of environmentconfig.ingress.enabled and environmentconfig.httpRoute.enabled" -}}
{{- end -}}
{{- if and $httpRoute.enableS3 (not $httpRoute.enabled) -}}
  {{- fail "environmentconfig.httpRoute.enableS3 requires environmentconfig.httpRoute.enabled" -}}
{{- end -}}
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: {{ .Values.environmentconfig.name | default "datalab" | quote }}
  {{- include "wp.annotations.block" (dict "global" .Values.globalAnnotations "local" .Values.environmentconfig.annotations) | nindent 2 }}
data:
{{- toYaml $data | nindent 2 }}
